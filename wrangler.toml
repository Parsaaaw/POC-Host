name = "poc-host"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Created by: wrangler d1 create poc_host_db
# Paste the database_id that command prints below.
[[d1_databases]]
binding = "DB"
database_name = "poc_host_db"
database_id = "YOUR_DATABASE_ID"

# CREATE_TOKEN is set as a secret, not here:
#   wrangler secret put CREATE_TOKEN
# (skip it if you don't want token protection on create/list/api)
